<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Waterworld</title>
    <style>
      html, body { margin: 0; height: 100%; background: #05070a; overflow: hidden; }
      canvas { display: block; width: 100vw; height: 100vh; cursor: crosshair; }
      #debug {
        position: fixed; left: 12px; top: 10px; color: #d8d4c8; font: 11px/1.5 ui-monospace, Menlo, monospace;
        white-space: pre; pointer-events: none; display: none; text-shadow: 0 1px 2px #000;
      }
      #fade { position: fixed; inset: 0; background: #020304; opacity: 0; pointer-events: none; transition: opacity 0.35s ease; }
      #page {
        position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
        background: rgba(3, 5, 7, 0.82);
      }
      #page div {
        width: min(560px, 78vw); min-height: 50vh; padding: 56px 52px; box-sizing: border-box;
        background: #cfc7b0; color: #1d1a16; white-space: pre-wrap;
        font: 25px/1.55 "Bradley Hand", "Segoe Script", "Snell Roundhand", "Apple Chancery", cursive;
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.7), inset 0 0 80px rgba(90, 70, 40, 0.28);
        transform: rotate(-0.8deg);
        background-image: repeating-linear-gradient(transparent 0 37.75px, rgba(60, 70, 90, 0.16) 37.75px 38.75px);
      }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="debug"></div>
    <div id="page"><div></div></div>
    <div id="fade"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
